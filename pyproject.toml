[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meldai"
version = "0.1.0"
description = "Medical science data analysis, clinical embeddings (SapBERT), HPO and MONDO offline terminology"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MeldAI Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "debugpy>=1.8.1",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "pandas>=2.2.2",
    "pymongo==4.18.2",
    "torch==2.14.0",
    "transformers==5.17.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "spacy==3.8.2",
    "thinc==8.3.13",
    "medspacy==1.3.1",
    "scikit-learn>=1.4.2",
    "pronto>=2.5.0",
    "networkx>=3.3",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
]

[project.scripts]
meldai = "meldai.main:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
